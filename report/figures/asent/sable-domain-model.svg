<foreignObject x="44" y="22" width="1712" height="42"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden;text-align:left;font:700 23.0px Arial,sans-serif;line-height:1.25;color:#17324D;word-break:normal">08  SABLE domain model · protected obligation to decision</xhtml:div></foreignObject>
<rect x="40" y="72" width="1720" height="46" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<foreignObject x="40" y="74" width="1702" height="42"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#536579;word-break:normal">Flow: obligation verifies baseline; candidate model yields successor hypotheses; the same obligation is checked on that successor; candidate-bound evidence feeds the shared gate.</xhtml:div></foreignObject>
<rect x="35" y="165" width="390" height="175" rx="2" fill="#E8F1FA" stroke="#4776A8" stroke-width="1.5" opacity="1"/>
<foreignObject x="44" y="167" width="372" height="171"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Registered Obligation</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>obligation id<br/>principal / IAM role<br/>protected logical asset<br/>required actions + resource scope<hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>authority: trusted baseline + policy</xhtml:div></foreignObject>
<rect x="465" y="165" width="380" height="175" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" opacity="1"/>
<foreignObject x="474" y="167" width="362" height="171"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Baseline Model</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>normalized resources + addresses<br/>attributes · module context<br/>reference graph · outputs<br/>moved records · parse errors<hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>used to verify the initial obligation</xhtml:div></foreignObject>
<rect x="885" y="165" width="380" height="175" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" opacity="1"/>
<foreignObject x="894" y="167" width="362" height="171"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Candidate Model</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>normalized Terraform resources<br/>references + module context<br/>outputs + moved blocks<br/>unsupported cases / parse errors<hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>same bounded parser</xhtml:div></foreignObject>
<rect x="1305" y="165" width="450" height="175" rx="2" fill="#DDF3EF" stroke="#197A72" stroke-width="1.5" opacity="1"/>
<foreignObject x="1314" y="167" width="432" height="171"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Successor Hypothesis</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>candidate address + score<br/>move / physical-bucket evidence<br/>Asset + Stage tags<br/>exported-reference signal<br/>conflict / confidence checks</xhtml:div></foreignObject>
<rect x="230" y="465" width="410" height="190" rx="2" fill="#F0EAFB" stroke="#7560A8" stroke-width="1.5" opacity="1"/>
<foreignObject x="239" y="467" width="392" height="186"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Authorization Projection</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>principal attachment<br/>required action coverage<br/>protected S3 object scope<br/>grants / denies / missing actions<br/>widening / misbinding / outside-model</xhtml:div></foreignObject>
<rect x="700" y="465" width="410" height="190" rx="2" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.5" opacity="1"/>
<foreignObject x="709" y="467" width="392" height="186"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>SABLE Result</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/><strong>PRESERVED</strong> · obligation holds<br/><strong>REGRESSED</strong> · known violation<br/><strong>UNKNOWN</strong> · insufficient support<hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>reason + uncertainty + trace</xhtml:div></foreignObject>
<rect x="1170" y="465" width="430" height="190" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" opacity="1"/>
<foreignObject x="1179" y="467" width="412" height="186"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Candidate-bound Evidence</strong><hr style="border:0;border-top:1px solid #c5d2dc;width:100%"/>run id + analyzer = SABLE<br/>module status + input hash<br/>candidate snapshot<br/>integrity_valid + stale flag<br/>details / uncertainty</xhtml:div></foreignObject>
<rect x="570" y="790" width="660" height="95" rx="12" fill="#E2F5E8" stroke="#29834B" stroke-width="1.6" opacity="1"/>
<foreignObject x="570" y="792" width="642" height="91"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 14.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>Shared final decision</strong><br/>ACCEPT / REVIEW / BLOCK<br/>only from current, correctly bound, integrity-valid evidence</xhtml:div></foreignObject>
<rect x="190" y="925" width="1420" height="46" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<foreignObject x="190" y="927" width="1402" height="42"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 11.0px Arial,sans-serif;line-height:1.25;color:#536579;word-break:normal">Correspondence decides which candidate resource may represent the protected logical asset; authorization then verifies the obligation on that successor. These are separate checks.</xhtml:div></foreignObject>
</svg>