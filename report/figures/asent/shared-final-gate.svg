<foreignObject x="35" y="807" width="462" height="90"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>BLOCK</strong><br/>CAVR REJECTED, SATRA REJECT,<br/>SABLE REGRESSED, or blocking flag</xhtml:div></foreignObject>
<rect x="655" y="805" width="490" height="94" rx="12" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.6" opacity="1"/>
