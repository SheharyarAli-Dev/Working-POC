<foreignObject x="44" y="22" width="1512" height="42"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:9px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden;text-align:left;font:700 23.0px Arial,sans-serif;line-height:1.25;color:#17324D;word-break:normal">07  SABLE · Terraform obligation verification</xhtml:div></foreignObject>
<rect x="40" y="72" width="1520" height="46" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<foreignObject x="40" y="74" width="1502" height="42"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#536579;word-break:normal">The implemented path verifies baseline authority first, identifies one supported logical successor, then checks the same principal/actions/resource-scope obligation against that successor.</xhtml:div></foreignObject>
<rect x="480" y="140" width="640" height="78" rx="12" fill="#E8F1FA" stroke="#4776A8" stroke-width="1.6" opacity="1"/>
<foreignObject x="480" y="142" width="622" height="74"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">Inputs<br/>trusted baseline + candidate Terraform/HCL<br/>registered principal, protected asset, required actions</xhtml:div></foreignObject>
<rect x="480" y="250" width="640" height="88" rx="12" fill="#E8F1FA" stroke="#4776A8" stroke-width="1.6" opacity="1"/>
<foreignObject x="480" y="252" width="622" height="84"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">Parse and normalize supported HCL<br/>resources · local modules · references · outputs · moved blocks<br/>retain parse errors and unsupported constructs</xhtml:div></foreignObject>
<rect x="685" y="375" width="230" height="100" rx="2" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.7" opacity="1"/>
<foreignObject x="685" y="377" width="212" height="96"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">Baseline exists, parses,<br/>and obligation holds?</xhtml:div></foreignObject>
<rect x="45" y="385" width="390" height="82" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6" opacity="1"/>
<foreignObject x="45" y="387" width="372" height="78"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>UNKNOWN</strong><br/>missing/empty or unverified baseline<br/>or incomplete parse</xhtml:div></foreignObject>
<rect x="480" y="525" width="640" height="92" rx="12" fill="#DDF3EF" stroke="#197A72" stroke-width="1.6" opacity="1"/>
<foreignObject x="480" y="527" width="622" height="88"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">Rank candidate successors<br/>resource type + moves + physical bucket identity<br/>Asset/Stage tags + exported-reference signals</xhtml:div></foreignObject>
<rect x="685" y="655" width="230" height="100" rx="2" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.7" opacity="1"/>
<foreignObject x="685" y="657" width="212" height="96"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">One supported successor<br/>and principal binding?</xhtml:div></foreignObject>
<rect x="45" y="665" width="390" height="82" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6" opacity="1"/>
<foreignObject x="45" y="667" width="372" height="78"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>UNKNOWN</strong><br/>ambiguous or conflicting candidates<br/>unresolved role binding</xhtml:div></foreignObject>
<rect x="480" y="805" width="640" height="90" rx="12" fill="#F0EAFB" stroke="#7560A8" stroke-width="1.6" opacity="1"/>
<foreignObject x="480" y="807" width="622" height="86"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">Project the registered obligation onto that successor<br/>principal attachment + required actions<br/>protected S3 object resource scope</xhtml:div></foreignObject>
<rect x="685" y="930" width="230" height="88" rx="2" fill="#FFF3D6" stroke="#B7791F" stroke-width="1.7" opacity="1"/>
<foreignObject x="685" y="932" width="212" height="84"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal">Authorization result<br/>known?</xhtml:div></foreignObject>
<rect x="45" y="940" width="390" height="80" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6" opacity="1"/>
<foreignObject x="45" y="942" width="372" height="76"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>UNKNOWN</strong><br/>unsupported IAM semantics<br/>or unresolved evaluation</xhtml:div></foreignObject>
<rect x="535" y="1050" width="300" height="64" rx="12" fill="#E2F5E8" stroke="#29834B" stroke-width="1.6" opacity="1"/>
<foreignObject x="535" y="1052" width="282" height="60"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 12.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>PRESERVED</strong><br/>the obligation still holds</xhtml:div></foreignObject>
<rect x="965" y="1050" width="350" height="64" rx="12" fill="#FCE8E8" stroke="#C44545" stroke-width="1.6" opacity="1"/>
<foreignObject x="965" y="1052" width="332" height="60"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:700 11.0px Arial,sans-serif;line-height:1.25;color:#203247;word-break:normal"><strong>REGRESSED</strong><br/>wrong target / missing action<br/>or boundary no longer holds</xhtml:div></foreignObject>
<rect x="100" y="1125" width="1400" height="36" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" opacity="1"/>
<foreignObject x="100" y="1127" width="1382" height="32"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;font:400 10.0px Arial,sans-serif;line-height:1.25;color:#536579;word-break:normal">SABLE is local and bounded: no terraform apply, AWS credentials, live resource deployment, or complete AWS authorization simulation. In the shared workflow, output evidence is bound to the candidate snapshot and SABLE input hash.</xhtml:div></foreignObject>
</svg>