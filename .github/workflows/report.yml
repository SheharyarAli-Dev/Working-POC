name: Report

on:
  push:
    paths: ["report/**", ".github/workflows/report.yml"]
  pull_request:
    paths: ["report/**"]
  workflow_dispatch:

jobs:
  pdf:
    name: Build FYP-1 mid report PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: main.tex
          latexmk_use_lualatex: false
          continue_on_error: false
      - name: Preserve LaTeX diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FYP1-report-build-diagnostics
          path: |
            report/main.log
            report/main.fdb_latexmk
            report/main.fls
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FYP1-mid-report
          path: report/main.pdf
